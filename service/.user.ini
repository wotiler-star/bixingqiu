; ===========================================================================
; 币星球 · PHP 运行时配置（Hostinger 使用 PHP-FPM/LSAPI，支持 .user.ini）
; 部署位置：public_html/service/.user.ini
;
; 说明：.user.ini 只能设置 PHP_INI_PERDIR / PHP_INI_USER 级别的项。
;       像 expose_php 这类 PHP_INI_SYSTEM 项需要在 hPanel 的
;       「网站 → PHP 配置」里改，写在这里会被忽略（不报错）。
; ===========================================================================

; ---- 错误输出：生产环境绝不能把报错打到页面上 ----
; 本项目前端按 JSON 解析接口响应，一旦 PHP 把 Warning/Notice 打进响应体，
; 前端 JSON.parse 直接抛错 → 白屏。
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_NOTICE & ~E_WARNING

; ---- 会话安全 ----
session.cookie_httponly = 1
session.use_strict_mode = 1
session.cookie_samesite = "Lax"
session.gc_maxlifetime = 1800

; ---- 上传限制（与 upload_json.php 的 10MB 白名单保持一致）----
upload_max_filesize = 10M
post_max_size = 12M
max_file_uploads = 20

; ---- 执行限制 ----
max_execution_time = 60
memory_limit = 256M

; ---- 时区（与 config/system.php 的 Etc/GMT-8 = UTC+8 一致）----
date.timezone = "Asia/Shanghai"

; ---- 默认字符集 ----
default_charset = "UTF-8"
